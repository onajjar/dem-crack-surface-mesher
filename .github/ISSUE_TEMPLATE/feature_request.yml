name: Feature request
description: Propose a focused enhancement or scientific workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this solve, and for whom?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest compatible implementation you have in mind.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation approach
      description: Explain how behavior, numerical impact, mesh quality, or compatibility should be assessed.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope checks
      options:
        - label: I understand that changes to immutable baseline files require explicit scientific justification.
          required: true
        - label: I checked for an existing issue covering this request.
          required: true
