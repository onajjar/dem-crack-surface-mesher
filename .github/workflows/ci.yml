name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints-baseline.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c constraints-baseline.txt

      - name: Verify immutable baseline
        run: python scripts/verify_baseline.py

      - name: Lint maintained Python sources
        run: python -m ruff check .

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run tests
        run: python -m pytest -q

      - name: Compare fitting and contact to frozen MATLAB oracle
        run: >-
          python scripts/validate_matlab_fitting.py --groups arbitrary contact
          --output _runtime/matlab-fitting.json

      - name: Fetch full DEAP inputs for native Linux comparison
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: git lfs pull --include="examples/deap/**"

      - name: Compare all real DEAP cases on native Linux
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: >-
          python scripts/validate_matlab_fitting.py --groups deap
          --output _runtime/matlab-deap.json

      - name: Save numerical comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matlab-${{ matrix.os }}-${{ matrix.python-version }}
          path: _runtime/matlab-*.json
          if-no-files-found: ignore

  container:
    name: Docker / Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose definition
        run: docker compose config --quiet

      - name: Build container image
        run: docker build --tag dem-crack-surface-mesher:local .

      - name: Check image entry point
        run: docker run --rm dem-crack-surface-mesher:local --help

      - name: Check Compose one-off runner
        run: docker compose run --rm --no-deps mesher

      - name: Validate source-free example in container
        run: >-
          docker run --rm dem-crack-surface-mesher:local
          --headless examples/docker/constant-planes.ini --validate-only

      - name: Run source-free mesh in container
        run: >-
          docker run --rm dem-crack-surface-mesher:local
          --headless examples/docker/constant-planes.ini
