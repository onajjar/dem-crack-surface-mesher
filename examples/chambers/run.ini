# Reproducible headless inlet/outlet chamber example.
# Run from the repository root:
# python.exe .\castem_pipeline_gui_scientific.py --headless .\examples\chambers\run.ini
# Add --validate-only to check all inputs without starting Cast3M.

[run]
operation = mesh
castem_version = 25
working_directory = ../../_runtime/chambers-headless-example
archive_existing_outputs = true

[files]
# The same single mesh source is used with chambers enabled or disabled.
# Chamber code is injected only into the generated working-directory DGIBI.
mesh_template = ../../source_codes/castem_tool.dgibi
fiss_template = ../../source_codes/fuite_fissure.dgibi
x_csv = ../input/xrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
y_csv = ../input/yrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmin_csv = ../input/zfit_zmin_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmax_csv = ../input/zfit_zmax_ti60_crpa1_smfa5_numsp50_opmin1.csv

[surface]
mode = csv

[mesh]
mode = python
elements_x = 2
elements_y = 2
elements_z = 30
geometric_tolerance = 1e-10
z_inflation_factor = 1.025
hole_radial_cells = 15
hole_outer_inner_ratio = 5
export_med = false
export_stl = true
merge_bdfs = true
open_gmsh = false

[holes]
enabled = true
hole1 = circle, -0.20, 0.20, 0.07
hole2 = circle, 0.20, -0.20, 0.07

[chambers]
# One shared total height; Cast3M adds half above and half below the crack.
enabled = true
height = 0.20
inlet_length = 0.20
outlet_length = 0.20
# Height counts are totals and must be even because each is split in half.
inlet_height_elements = 10
outlet_height_elements = 10
inlet_length_elements = 10
outlet_length_elements = 10
# Ratios >= 1 make cells smallest at the crack and larger toward remote walls.
inlet_height_ratio = 5
outlet_height_ratio = 5
inlet_length_ratio = 5
outlet_length_ratio = 5

[fiss]
# Required for configuration completeness; unused when operation = mesh.
model = POISEU_GELAIN_2012
gas = PARF
condensation = MASS
critical_reynolds = 10
wall_temperature = 25
downstream_pressure = 101325
steam_pressure = 0
line_subdivisions = 5
pressure_mode = range
pressure_start = 101325
pressure_end = 500000
pressure_step = 250000
temperature_mode = range
temperature_start = 25
temperature_end = 50
temperature_step = 25
