# Change only this case's [surface] mode between deap and csv.
[run]
operation = mesh
castem_version = 25
working_directory = results
archive_existing_outputs = true

[files]
mesh_template = ../../../source_codes/castem_tool.dgibi
fiss_template = ../../../source_codes/fuite_fissure.dgibi
x_csv = reference/xrange_ti50_crpa1_smfa5_numsp20_opmin20000.csv
y_csv = reference/yrange_ti50_crpa1_smfa5_numsp20_opmin20000.csv
zmin_csv = reference/zfit_zmin_ti50_crpa1_smfa5_numsp20_opmin20000.csv
zmax_csv = reference/zfit_zmax_ti50_crpa1_smfa5_numsp20_opmin20000.csv

[surface]
mode = deap
orientation = YZ
magnification = 1.0
bounding_box =

[naming]
ti = 50
crpa = 1
smfa = 0.05
numspa = 20
opmin = 2e-5

[mesh]
mode = python
elements_x = 1
elements_y = 1
elements_z = 1
geometric_tolerance = 1e-10
z_inflation_factor = 1.05
hole_radial_cells = 5
hole_outer_inner_ratio = 5.0
export_med = false
export_stl = false
merge_bdfs = true
open_gmsh = false

[holes]
enabled = false

[fiss]
model = POISEU_GELAIN_2012
gas = PARF
condensation = MASS
critical_reynolds = 10.0
wall_temperature = 25.0
downstream_pressure = 101325.0
steam_pressure = 0.0
line_subdivisions = 5
pressure_mode = single
pressure_in = 5e5
temperature_mode = single
temperature_in = 25.0
