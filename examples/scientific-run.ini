# Complete headless configuration. Paths are relative to this file.
# Boolean options accept: true/false, yes/no, on/off, or 1/0.
# Decimal values may use standard scientific notation, for example 1e-6.

[run]
# Allowed: mesh | fiss | both | characterize | characterize_and_mesh
# Characterization remains optional and runs on the same reconstructed surface.
operation = mesh
# Cast3M launcher version for python/reference/FISS; ignored by python_only.
# Normally 25 or 2025. CASTEM_PATH may override discovery.
castem_version = 25
working_directory = ../_runtime/headless-scientific-run
# true: move old fixed-name mesh files to _previous_mesh_runs.
# false: refuse to run when old fixed-name mesh files are present.
archive_existing_outputs = true

[files]
# Every path can be relative to this INI file or absolute.
# mesh_template may be omitted for python_only meshing.
mesh_template = ../source_codes/castem_tool.dgibi
fiss_template = ../source_codes/fuite_fissure.dgibi
x_csv = input/xrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
y_csv = input/yrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmin_csv = input/zfit_zmin_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmax_csv = input/zfit_zmax_ti60_crpa1_smfa5_numsp50_opmin1.csv

[surface]
# Allowed modes: csv | deap | fractal | constant
# csv reads the four paths in [files]. Generated modes create the same four
# canonical CSV matrices inside the isolated working directory before meshing.
# deap reads deap_post.h5/deap_output.h5 from working_directory and uses the
# five [naming] values as its time step, component, span, grid, and threshold.
# csv derives those values from the four canonical filenames instead.
mode = csv

# DEAP options. input.boundary in working_directory is preferred; otherwise
# enter: Xmin Xmax Ymin Ymax Zmin Zmax.
orientation = ZX
magnification = 1.0
bounding_box =

# Options used by fractal and constant modes:
# points_x/points_y are grid POINT counts, so base cells are one fewer.
points_x = 50
points_y = 50
size_x = 1.2
size_y = 0.9
center_x = 0.0
center_y = 0.0

# Fractal mode accepts either H or D. Leave one entry empty. If both are
# supplied they must satisfy D = 3 - H. Valid ranges: 0 < H < 1, 2 < D < 3.
hurst_exponent = 0.8
fractal_dimension =
# RMS height sets vertical roughness magnitude; H or D alone sets only scaling.
rms_height = 5e-5
# Parallel self-affine walls are separated by this strictly positive aperture.
mean_aperture = 2e-4
# Integer seed makes the generated surface exactly reproducible.
random_seed = 20260721

# Constant mode creates two flat walls. Equal values are rejected because a
# zero-thickness crack cannot produce a valid Cast3M volume mesh.
constant_zmin = 0.0
constant_zmax = 2e-4

[naming]
# Editable inputs only for DEAP fitting. CSV mode ignores these entries and
# derives the values from all four filenames. Fractal/constant use the existing
# 60/1/0.05/50/1e-6 defaults.
ti = 60
crpa = 1
smfa = 0.05
numspa = 50
opmin = 1e-6

[characterization]
# false preserves the historical direct-to-mesh behavior. Set true to run this
# stage before a normal mesh operation, or use operation = characterize for a
# characterization-only run.
enabled = false
output_directory = ../_runtime/headless-scientific-run/characterization
# local_normal is preferred for matching upper/lower walls. global_z reports
# upper minus lower along the structured grid's global Z direction.
aperture_method = local_normal
# Allowed: X | Y | Z | auto | custom. The global vector is projected into the
# fitted crack plane; a normal vector with no in-plane projection is rejected.
flow_direction = Y
custom_flow_vector = 1, 1, 0
tortuosity_direction = flow
custom_tortuosity_vector = 1, 1, 0
aperture_cutoff = 1e-12
allow_negative_aperture = false
interpolate_missing = false
length_unit = m
normal_smoothing_sigma = 0
hurst_min_lag = 1
hurst_max_scale_fraction = 0.25
hurst_bootstrap_samples = 100
random_seed = 20260723
generate_figures = true
publication_formats = png, pdf, svg
figure_dpi = 220

[synthetic]
# Optional statistically representative realization and automatic verification.
enabled = false
points_x = 64
points_y = 64
size_x = 1.2
size_y = 0.9
mean_aperture = 2e-4
aperture_standard_deviation = 4e-5
mid_surface_rms = 2e-5
hurst_x = 0.8
hurst_y = 0.7
correlation_length_x =
correlation_length_y =
minimum_aperture = 0
maximum_aperture =
contact_fraction = 0
positive_aperture = true
mean_plane_slope_x = 0
mean_plane_slope_y = 0
random_seed = 20260723
realizations = 1

[mesh]
# Allowed: python_only | python | reference
# python_only: complete source-free NumPy HEXA8 volume and automatic PNG.
# python: fast conformal inflated fill plus Cast3M volume construction.
# reference: unchanged Cast3M fill and volume construction.
mode = python
# Integer subdivisions of each structured source-grid edge in X and Y.
# A hole wall has no independent edge-count option: the runner derives exactly
# the same count as its surrounding square contour (64 = 64 here).
elements_x = 2
elements_y = 2
# Integer subdivisions through the crack opening.
elements_z = 1
geometric_tolerance = 1e-10
# Positive through-opening cell-size factor used by the selected mesh backend.
z_inflation_factor = 1.05
# Positive integer radial cells from each square contour to its hole wall.
hole_radial_cells = 5
# Positive outermost / hole-adjacent radial cell-width ratio. Use 1 for uniform.
hole_outer_inner_ratio = 5.0
# Each export/merge option accepts any Boolean spelling listed at the top.
export_med = false
# true safely converts boundary BDFs to high-precision ASCII STL in Python.
# In Cast3M modes, its native STL block remains commented out.
export_stl = false
merge_bdfs = true
# false: fully unattended; true: open the final BDF in Gmsh after Cast3M.
# python_only requires false and writes python_mesh_preview.png automatically.
# GMSH_PATH may point to gmsh.exe or its directory.
open_gmsh = false

[holes]
# false: ignore all holeN entries; true: require at least one valid holeN entry.
enabled = true
# Supported specifications:
# circle, center_x, center_y, radius
# rectangle, center_x, center_y, width, height, rotation_degrees
# triangle, center_x, center_y, side_length, rotation_degrees
# regular_polygon, center_x, center_y, sides, circumradius, rotation_degrees
# The legacy circle shorthand "center_x, center_y, radius" also remains valid.
# Add hole3, hole4, ... without a fixed maximum; numbering gaps are accepted.
# Delete/comment unwanted holeN lines. All dimensions must be positive.
# Non-circular shapes require mode = python or python_only and are not used by FISS.
hole1 = circle, -0.20, 0.20, 0.07
hole2 = circle, 0.20, -0.20, 0.07

[chambers]
# Optional inlet/outlet boxes at the crack's global Ymin/Ymax faces. In
# Cast3M mode, the runner activates native opti_chamb. In python_only mode,
# the source-free topology builder consumes the same values directly.
enabled = false
# One common total height, split equally above and below the crack.
height = 0.20
inlet_length = 0.20
outlet_length = 0.20
# Total height counts must be even; length counts must be positive integers.
inlet_height_elements = 10
outlet_height_elements = 10
inlet_length_elements = 10
outlet_length_elements = 10
# Ratios >= 1 grade from small cells at the crack to larger remote cells.
inlet_height_ratio = 5.0
outlet_height_ratio = 5.0
inlet_length_ratio = 5.0
outlet_length_ratio = 5.0

[fiss]
# These options are used when operation is fiss or both, but are always validated.
# Allowed model values:
#   POISEU_BLASIUS
#   POISEU_COLEBROOK
#   POISEU_GELAIN_2008
#   POISEU_GELAIN_2012
#   POISEU_RIZKALLA
#   FROTTEMENT1
#   FROTTEMENT2
#   FROTTEMENT3
#   FROTTEMENT4
model = POISEU_GELAIN_2012
# Allowed gas: PARF (perfect) | REEL (real)
gas = PARF
# Allowed condensation: MASS | FILM
condensation = MASS
# Model-specific inputs:
# roughness: POISEU_COLEBROOK, FROTTEMENT3, FROTTEMENT4
# critical_reynolds: GELAIN_2008/2012, RIZKALLA, FROTTEMENT1/2
# fk/fa/fb/fc/fd: FROTTEMENT1/2
# fk_k: FROTTEMENT3/4
# POISEU_BLASIUS fixes roughness to zero. Unused values below are ignored.
roughness = 40e-6
critical_reynolds = 10.0
fk = 96.0
fa = 0.316
fb = 2.0e-6
fc = -0.25
fd = 2.0
fk_k = 0.5
wall_temperature = 25.0
downstream_pressure = 101325.0
steam_pressure = 0.0
line_subdivisions = 5
# Allowed pressure_mode: single | range
# single uses pressure_in; range uses pressure_start/end/step.
pressure_mode = range
pressure_in = 5e5
pressure_start = 101325.0
pressure_end = 5e5
pressure_step = 2.5e5
# Allowed temperature_mode: single | range
# single uses temperature_in; range uses temperature_start/end/step.
temperature_mode = range
temperature_in = 25.0
temperature_start = 25.0
temperature_end = 50.0
temperature_step = 25.0
