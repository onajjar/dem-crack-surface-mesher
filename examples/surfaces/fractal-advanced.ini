# Directional, roll-off, non-Gaussian crack with independently rough walls.

[run]
operation = mesh
castem_version = 25
working_directory = ../../_runtime/fractal-advanced-example
archive_existing_outputs = true

[files]
fiss_template = ../../source_codes/fuite_fissure.dgibi

[surface]
mode = fractal
points_x = 96
points_y = 72
size_x = 1.2
size_y = 0.9
center_x = 0.0
center_y = 0.0

# Directional self-affine exponents; Dx = 3 - Hx and Dy = 3 - Hy.
hurst_exponent =
fractal_dimension =
hurst_exponent_x = 0.85
hurst_exponent_y = 0.55

# Directional wavelengths below which the low-wavenumber spectrum rolls off.
rolloff_wavelength_x = 0.4
rolloff_wavelength_y = 0.12

# Independent walls have correlation 0; correlation 1 recovers parallel walls
# when their RMS values and distributions are equal.
rms_height = 1e-5
lower_wall_rms = 1e-5
upper_wall_rms = 1.2e-5
wall_correlation = 0.0
height_distribution = lognormal
lognormal_shape = 0.5

mean_aperture = 2e-4
minimum_aperture = 1e-6
random_seed = 42

[naming]
ti = 60
crpa = 1
smfa = 0.05
numspa = 50
opmin = 1e-6

[mesh]
mode = python_only
elements_x = 1
elements_y = 1
elements_z = 1
geometric_tolerance = 1e-10
z_inflation_factor = 1.05
hole_radial_cells = 5
hole_outer_inner_ratio = 5.0
export_med = false
export_stl = false
merge_bdfs = true
open_gmsh = false

[holes]
enabled = true
hole1 = circle, -0.20, 0.15, 0.06
hole2 = rectangle, 0.20, -0.15, 0.12, 0.08, 20

[fiss]
model = POISEU_GELAIN_2012
gas = PARF
condensation = MASS
critical_reynolds = 10.0
wall_temperature = 25.0
downstream_pressure = 101325.0
steam_pressure = 0.0
line_subdivisions = 5
pressure_mode = single
pressure_in = 5e5
temperature_mode = single
temperature_in = 25.0
