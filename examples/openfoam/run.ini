# Source-free mesh plus OpenFOAM case export.
# Run from the repository root:
#   Linux:   ./run_linux.sh --headless examples/openfoam/run.ini
#   Windows: python.exe .\castem_pipeline_gui_scientific.py --headless .\examples\openfoam\run.ini
# Then, inside an OpenFOAM environment (on Windows: WSL or Docker):
#   cd _runtime/openfoam-example/openfoam_case && ./Allrun
# No Cast3M or Gmsh installation is required; OpenFOAM is needed only to run the case.

[run]
operation = mesh
working_directory = ../../_runtime/openfoam-example
archive_existing_outputs = true

[files]
x_csv = ../input/xrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
y_csv = ../input/yrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmin_csv = ../input/zfit_zmin_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmax_csv = ../input/zfit_zmax_ti60_crpa1_smfa5_numsp50_opmin1.csv

[surface]
mode = csv

[mesh]
mode = python_only
elements_x = 1
elements_y = 1
elements_z = 4
geometric_tolerance = 1e-10
z_inflation_factor = 1.0
hole_radial_cells = 6
hole_outer_inner_ratio = 5
export_med = false
export_stl = false
merge_bdfs = true
open_gmsh = false
export_openfoam = true

[holes]
enabled = true
hole1 = circle, -0.20, 0.20, 0.07
hole2 = circle, 0.20, -0.20, 0.07

[chambers]
# Many height elements keep the first chamber cells within a few times the
# thickness of the crack layers they touch (see docs/openfoam-export.md).
enabled = true
height = 0.04
inlet_length = 0.05
outlet_length = 0.05
inlet_height_elements = 20
outlet_height_elements = 20
inlet_length_elements = 10
outlet_length_elements = 10
inlet_height_ratio = 5
outlet_height_ratio = 5
inlet_length_ratio = 5
outlet_length_ratio = 5

[openfoam]
# Every option, with its default, is listed in examples/scientific-run.ini.
case_directory = openfoam_case
solver = simpleFoam
openfoam_version = com
cell_split = auto
# The bundled surfaces are read as metres.
length_scale = 1.0
inlet_pressure = 111325
outlet_pressure = 101325
temperature = 298.15
iterations = 3000
write_interval = 1000

[fiss]
# Parsed for configuration compatibility but unused by operation = mesh.
model = POISEU_GELAIN_2012
gas = PARF
condensation = MASS
critical_reynolds = 10
wall_temperature = 25
downstream_pressure = 101325
steam_pressure = 0
line_subdivisions = 5
pressure_mode = single
pressure_in = 500000
temperature_mode = single
temperature_in = 25
