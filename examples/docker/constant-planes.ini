# Minimal source-free container example: two parallel 20 x 20 constant planes.

[run]
operation = mesh
working_directory = ../../_runtime/docker-constant-planes-example
archive_existing_outputs = true

[files]
# No Cast3M or FISS template is required by python_only mode.

[surface]
mode = constant
points_x = 20
points_y = 20
size_x = 1.2
size_y = 0.9
center_x = 0.0
center_y = 0.0
constant_zmin = 0.0
constant_zmax = 2e-4

[naming]
ti = 60
crpa = 1
smfa = 0.05
numspa = 20
opmin = 1e-6

[mesh]
mode = python_only
elements_x = 1
elements_y = 1
elements_z = 1
geometric_tolerance = 1e-10
z_inflation_factor = 1.0
hole_radial_cells = 5
hole_outer_inner_ratio = 5.0
export_med = false
export_stl = false
merge_bdfs = true
open_gmsh = false

[holes]
enabled = false

[fiss]
# Parsed for configuration compatibility but unused by operation = mesh.
model = POISEU_GELAIN_2012
gas = PARF
condensation = MASS
critical_reynolds = 10.0
wall_temperature = 25.0
downstream_pressure = 101325.0
steam_pressure = 0.0
line_subdivisions = 5
pressure_mode = single
pressure_in = 5e5
temperature_mode = single
temperature_in = 25.0
