[run]
operation = characterize
castem_version = 25
working_directory = ../../_runtime/characterize-only
archive_existing_outputs = true

[files]
mesh_template = ../../source_codes/castem_tool.dgibi
fiss_template = ../../source_codes/fuite_fissure.dgibi
x_csv = ../input/xrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
y_csv = ../input/yrange_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmin_csv = ../input/zfit_zmin_ti60_crpa1_smfa5_numsp50_opmin1.csv
zmax_csv = ../input/zfit_zmax_ti60_crpa1_smfa5_numsp50_opmin1.csv

[surface]
mode = csv

[characterization]
enabled = true
output_directory = ../../_runtime/characterize-only/characterization
aperture_method = local_normal
flow_direction = Y
custom_flow_vector = 1, 1, 0
tortuosity_direction = flow
custom_tortuosity_vector = 1, 1, 0
aperture_cutoff = 1e-12
allow_negative_aperture = false
interpolate_missing = false
length_unit = m
normal_smoothing_sigma = 0
hurst_min_lag = 1
hurst_max_scale_fraction = 0.25
hurst_bootstrap_samples = 30
random_seed = 20260723
generate_figures = true
publication_formats = png
figure_dpi = 160

[synthetic]
enabled = false

[mesh]
mode = python
elements_x = 2
elements_y = 2
elements_z = 1
geometric_tolerance = 1e-10
z_inflation_factor = 1.05
hole_radial_cells = 5
hole_outer_inner_ratio = 5
export_med = false
export_stl = false
merge_bdfs = true
open_gmsh = false

[holes]
enabled = false

[fiss]
model = POISEU_GELAIN_2012
gas = PARF
condensation = MASS
roughness = 40e-6
critical_reynolds = 10
fk = 96
fa = 0.316
fb = 2e-6
fc = -0.25
fd = 2
fk_k = 0.5
wall_temperature = 25
downstream_pressure = 101325
steam_pressure = 0
line_subdivisions = 5
pressure_mode = single
pressure_in = 5e5
pressure_start = 101325
pressure_end = 5e5
pressure_step = 2.5e5
temperature_mode = single
temperature_in = 25
temperature_start = 25
temperature_end = 50
temperature_step = 25
